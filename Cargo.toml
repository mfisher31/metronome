[workspace]
members = [
    "crates/core",
    "crates/web",
]
resolver = "2"

# Shared release profile for all crates
[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

# Lean WASM builds — optimise for size over speed
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
