<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Metronome</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <h1>Metronome</h1>
  <div class="metro-card">

    <!-- BPM display -->
    <div class="metro-bpm-row">
      <input id="bpm-number" type="number" min="20" max="300" value="120" />
      <span class="metro-bpm-label">BPM</span>
    </div>

    <!-- Beat indicator -->
    <div id="beat-dots"></div>

    <!-- Controls -->
    <div class="metro-controls">

      <div class="metro-row">
        <label for="bpm-slider">Tempo</label>
        <input id="bpm-slider" type="range" min="20" max="300" value="120" />
      </div>

      <div class="metro-row">
        <label for="beats-per-bar">Meter</label>
        <select id="beats-per-bar">
          <option value="2">2/4</option>
          <option value="3">3/4</option>
          <option value="4" selected>4/4</option>
          <option value="5">5/4</option>
          <option value="6">6/8</option>
          <option value="7">7/8</option>
        </select>
      </div>

      <div class="metro-row">
        <label for="gain-slider">Volume</label>
        <input id="gain-slider" type="range" min="0" max="1" step="0.01" value="1" />
      </div>

      <div class="metro-toggle-row">
        <input id="accent-toggle" type="checkbox" checked />
        <label for="accent-toggle" style="min-width:unset">Accent beat 1</label>
      </div>

    </div>

    <!-- Action buttons -->
    <div class="metro-buttons">
      <button id="btn-start">Start</button>
      <button id="btn-tap">Tap (Space)</button>
    </div>

  </div>

  <div class="metro-about">
    <div class="metro-stack">
      <span class="metro-chip">Rust</span>
      <span class="metro-chip">WebAssembly</span>
      <span class="metro-chip">AudioWorklet</span>
      <span class="metro-chip">Vite</span>
    </div>
    <span>
      Sample-accurate DSP in Rust, compiled to WASM and run directly on the browser audio thread via AudioWorklet.
      Zero JS scheduling — all timing is handled by a phase accumulator in Rust.
    </span>
    <span>
      <a href="https://github.com/mfisher31/metronome" target="_blank" rel="noopener">github.com/mfisher31/metronome</a>
    </span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
